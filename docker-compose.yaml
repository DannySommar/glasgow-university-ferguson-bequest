services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-sh40db}
      - DB_USER=${DB_USER:-sh40user}
      - DB_PASSWORD=${DB_PASSWORD:-sh40password}
      - SESSION_SECRET=${SESSION_SECRET:-skibidi}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GATEWAY_URL=${GATEWAY_URL:-https://studentproject-gateway.dcs.gla.ac.uk/psd}
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    environment:
      - NGINX_PORT=5000
      - SERVER_NAME=${SERVER_NAME:-_}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sh40db}
      - POSTGRES_USER=${POSTGRES_USER:-sh40user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sh40password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata: